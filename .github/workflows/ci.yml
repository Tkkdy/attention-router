name: Limited offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  basic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned Python dependencies
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.lock.txt"
      - name: Python syntax and published-file checks
        run: python -B ci/check_source.py
      - name: Limited synthetic basic regressions
        run: python -B ci/run_basic.py
      - name: Console fixture contract (no browser or network)
        run: node hub/test_console_runtime.cjs
      - name: Agent HTTP example (synthetic loopback)
        run: python -B examples/test_agent_http_demo.py
      - name: DeepSeek adapter contracts (no model)
        run: node --test integrations/deepseek_bot/gateway-client.test.mjs

  mcp:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned optional MCP dependencies
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: -r hub/requirements_mcp.txt"
      - name: Isolated OAuth MCP discovery and Interrupt regression
        run: python -B ci/run_mcp.py
